# FORMA — Android build settings
#
# Development switches consumed by app/build.gradle.kts.

# When true the app loads the Vite dev server instead of the bundled assets.
# Combine it with `adb reverse tcp:8443 tcp:8443` to get live reload on device.
forma.useDevServer=false
forma.devServerUrl=http://localhost:8443

# Command used to run the web build. The default assumes pnpm is only
# reachable through corepack; set this to `pnpm` if you have it on your PATH.
forma.pnpmCommand=corepack,pnpm

org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

android.useAndroidX=true
android.nonTransitiveRClass=true
